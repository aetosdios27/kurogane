syntax = "proto3";

package kurogane;

// Peer-to-peer Raft RPCs. Field shapes mirror kurogane_raft::{RequestVote,
// RequestVoteResponse, AppendEntries, AppendEntriesResponse, LogEntry}
// exactly; conversion lives in kurogane-runtime's dto module, never in
// kurogane-raft itself.

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool granted = 2;
}

// A cluster's voting membership. `voters` is the active (or, mid-transition,
// the new) set; `old_voters` is the set being replaced during a
// joint-consensus transition. proto3 has no `optional repeated`, so an
// *empty* `old_voters` is the sentinel for "not joint" -- there is no
// separate presence bit to check.
message Configuration {
  repeated uint64 voters = 1;
  repeated uint64 old_voters = 2;
}

message LogEntry {
  uint64 term = 1;
  oneof payload {
    bytes command = 2;
    Configuration configuration = 3;
  }
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

// Sent instead of AppendEntries once a peer's next_index has fallen at or
// behind the leader's own compaction boundary. Single-shot, no chunking --
// a toy-sized KV's state fits one message, and a unary call either fully
// deserializes or errors, so there's no partial-apply risk to guard
// against (see kurogane_raft::Message::InstallSnapshot).
message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  // The membership active as of this snapshot's boundary -- without this,
  // a receiver that catches up purely through this transfer (never having
  // seen the Configuration log entries it summarizes) has no way to learn
  // current membership, and silently drops every later message from its
  // own leader once is_member() no longer recognizes it.
  Configuration config = 6;
}

message InstallSnapshotReply {
  uint64 term = 1;
  uint64 last_included_index = 2;
}

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotReply);
}

// Client-facing service. Command is structured here -- this is the wire
// boundary where SET/DELETE/GET semantics belong; kurogane_kv::Command's
// opaque-byte encoding is an internal replicated-log concern, not this RPC's.

message Command {
  oneof kind {
    SetCommand set = 1;
    DeleteCommand delete = 2;
    GetCommand get = 3;
  }
}

message SetCommand {
  bytes key = 1;
  bytes value = 2;
}

message DeleteCommand {
  bytes key = 1;
}

message GetCommand {
  bytes key = 1;
}

message ProposeRequest {
  Command command = 1;
}

// `Propose` blocks server-side until its assigned index actually applies
// (or a timeout elapses) rather than returning the bare index -- see
// dto::apply_result_to_proto and the RaftClient service comment below for
// why. `Indeterminate` covers both "still in flight" and "this index got
// truncated by a conflicting leader and will never apply": both look
// identical from the client's side (no value ever arrives), so a caller
// must treat it as "may or may not have taken effect," never as a
// definite failure.
message ProposeReply {
  oneof result {
    ProposeApplied applied = 1;
    NotLeader not_leader = 2;
    ProposeIndeterminate indeterminate = 3;
  }
}

message ProposeApplied {
  uint64 index = 1;
  ApplyResult result = 2;
}

// Mirrors kurogane_kv::ApplyResult exactly, one variant per Command kind.
message ApplyResult {
  oneof kind {
    SetResult set = 1;
    DeleteResult delete = 2;
    GetResult get = 3;
  }
}

message SetResult {
  optional bytes previous = 1;
}

message DeleteResult {
  optional bytes previous = 1;
}

message GetResult {
  optional bytes value = 1;
}

message ProposeIndeterminate {}

message NotLeader {
  // Absent when this node has no idea who the current leader is either.
  optional uint64 leader_id = 1;
}

// Begins a joint-consensus transition to `voters` (mirrors
// Node::propose_config_change's own parameter) -- the automatic
// C_old,new -> C_new follow-up and any resulting leader step-down happen
// entirely on their own, driven by ordinary commit advancement, not by any
// second RPC.
message ProposeConfigChangeRequest {
  repeated uint64 voters = 1;
}

message ProposeConfigChangeReply {
  oneof result {
    ProposeConfigChangeAccepted accepted = 1;
    NotLeader not_leader = 2;
  }
}

message ProposeConfigChangeAccepted {
  uint64 index = 1;
}

// Registers `node_id` as a non-voting learner with the current leader, so
// it starts receiving ordinary replication without being counted toward
// any quorum -- the safe on-ramp for a genuinely new server (see
// Node::add_learner's doc comment). `address` is this new server's gRPC
// endpoint, needed so the leader's transport can actually reach it; a
// join-mode node doesn't announce itself, since it doesn't yet know it's
// been admitted to anything.
message AddLearnerRequest {
  uint64 node_id = 1;
  string address = 2;
}

message AddLearnerReply {
  oneof result {
    AddLearnerAccepted accepted = 1;
    NotLeader not_leader = 2;
  }
}

// Node::add_learner has nothing meaningful to report back beyond having
// accepted the request (unlike Propose, there's no log index a client
// would ever want to poll for here) -- but the transport layer does have
// one useful fact: whether `address` even parsed as a valid URI.
message AddLearnerAccepted {
  // Whether the leader's transport accepted `address` as a well-formed
  // endpoint -- NOT confirmation that the peer is actually reachable.
  // Connections are lazy (see GrpcPeerTransport::add_peer/new), so a
  // syntactically valid but unreachable address still reports true here;
  // an unreachable-but-valid learner surfaces only indirectly, as a
  // catch-up timeout the caller must poll storage to notice.
  bool connected = 1;
}

service RaftClient {
  rpc Propose(ProposeRequest) returns (ProposeReply);
  rpc ProposeConfigChange(ProposeConfigChangeRequest) returns (ProposeConfigChangeReply);
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerReply);
}

// On-disk durable state. Not part of any RPC -- reused here rather than
// hand-rolling a third encoding, since this crate already depends on prost
// for the wire protocol. Rewritten and fsynced whole on every write; no WAL
// or checksums, and snapshot bytes are inlined here rather than in their own
// file -- both are accepted simplifications for a toy-sized KV, not
// unsolved problems (see the project wiki's open questions for the tradeoff
// as snapshots grow).
message StorageState {
  uint64 current_term = 1;
  optional uint64 voted_for = 2;
  repeated LogEntry log = 3;
  uint64 snapshot_last_included_index = 4;
  uint64 snapshot_last_included_term = 5;
  bytes snapshot_data = 6;
  // Non-voting learners this node (while leader) was tracking -- see
  // Effect::PersistLearners. Durable independently of hard state/log/
  // snapshot timing, since a leader can add a learner between any two
  // otherwise-unrelated persists.
  repeated uint64 learners = 7;
  // The membership active as of this snapshot's boundary -- see
  // Effect::PersistSnapshot's `config` field. Absent (proto3 message
  // fields have no separate "unset" the caller must round-trip through) on
  // a fresh node with no snapshot yet; Storage treats a missing field the
  // same as ClusterConfig::default().
  Configuration snapshot_config = 8;
}

