syntax = "proto3";

package kurogane;

// Peer-to-peer Raft RPCs. Field shapes mirror kurogane_raft::{RequestVote,
// RequestVoteResponse, AppendEntries, AppendEntriesResponse, LogEntry}
// exactly; conversion lives in kurogane-runtime's dto module, never in
// kurogane-raft itself.

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool granted = 2;
}

// A cluster's voting membership. `voters` is the active (or, mid-transition,
// the new) set; `old_voters` is the set being replaced during a
// joint-consensus transition. proto3 has no `optional repeated`, so an
// *empty* `old_voters` is the sentinel for "not joint" -- there is no
// separate presence bit to check.
message Configuration {
  repeated uint64 voters = 1;
  repeated uint64 old_voters = 2;
}

message LogEntry {
  uint64 term = 1;
  oneof payload {
    bytes command = 2;
    Configuration configuration = 3;
  }
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

// Sent instead of AppendEntries once a peer's next_index has fallen at or
// behind the leader's own compaction boundary. Single-shot, no chunking --
// a toy-sized KV's state fits one message, and a unary call either fully
// deserializes or errors, so there's no partial-apply risk to guard
// against (see kurogane_raft::Message::InstallSnapshot).
message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotReply {
  uint64 term = 1;
  uint64 last_included_index = 2;
}

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotReply);
}

// Client-facing service. Command is structured here -- this is the wire
// boundary where SET/DELETE/GET semantics belong; kurogane_kv::Command's
// opaque-byte encoding is an internal replicated-log concern, not this RPC's.

message Command {
  oneof kind {
    SetCommand set = 1;
    DeleteCommand delete = 2;
    GetCommand get = 3;
  }
}

message SetCommand {
  bytes key = 1;
  bytes value = 2;
}

message DeleteCommand {
  bytes key = 1;
}

message GetCommand {
  bytes key = 1;
}

message ProposeRequest {
  Command command = 1;
}

message ProposeReply {
  oneof result {
    ProposeAccepted accepted = 1;
    NotLeader not_leader = 2;
  }
}

message ProposeAccepted {
  uint64 index = 1;
}

message NotLeader {
  // Absent when this node has no idea who the current leader is either.
  optional uint64 leader_id = 1;
}

service RaftClient {
  rpc Propose(ProposeRequest) returns (ProposeReply);
}

// On-disk durable state. Not part of any RPC -- reused here rather than
// hand-rolling a third encoding, since this crate already depends on prost
// for the wire protocol. Rewritten and fsynced whole on every write; no WAL
// or checksums, and snapshot bytes are inlined here rather than in their own
// file -- both are accepted simplifications for a toy-sized KV, not
// unsolved problems (see the project wiki's open questions for the tradeoff
// as snapshots grow).
message StorageState {
  uint64 current_term = 1;
  optional uint64 voted_for = 2;
  repeated LogEntry log = 3;
  uint64 snapshot_last_included_index = 4;
  uint64 snapshot_last_included_term = 5;
  bytes snapshot_data = 6;
}

